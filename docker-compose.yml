x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://app_user@postgres:5432/cip
  DATABASE_SYSTEM_URL: postgres://app_system@postgres:5432/cip
  DATABASE_ADMIN_URL: postgres://postgres@postgres:5432/cip
  REDIS_URL: redis://redis:6379/1
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/cip
  RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DATABASE: cip
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_URL: http://localhost:4190
  S3_BUCKET: cip
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  API_HOST: 0.0.0.0
  COLLECTOR_HOST: 0.0.0.0
  GATEWAY_HOST: 0.0.0.0
  INTERNAL_API_URL: http://api:4100
  API_INTERNAL_URL: http://api:4100
  API_URL: http://api:4100
  COLLECTOR_URL: http://collector:4110
  ADMIN_URL: http://localhost:4140
  STOREFRONT_REVALIDATE_URL: http://storefront:4130/api/revalidate
  STOREFRONT_URL_TEMPLATE: http://{store}.localhost:4130
  REALTIME_PUBLIC_URL: ws://localhost:4120/ws
  COLLECTOR_PUBLIC_URL: http://localhost:4110
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4194
  EMBEDDINGS_PROVIDER: local
  EMBEDDINGS_URL: http://embeddings-server:4189
  LLM_PROVIDER: fake
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-characters}

services:
  postgres:
    build: { context: ., dockerfile: infra/docker/postgres.Dockerfile }
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: cip
    ports: ['5432:5432']
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'postgres'], interval: 2s, retries: 30 }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  rabbitmq:
    image: rabbitmq:4-management
    ports: ['5672:5672', '15672:15672']
    healthcheck: { test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping'], interval: 5s, retries: 30 }
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment: { CLICKHOUSE_SKIP_USER_SETUP: '1' }
    ports: ['8123:8123']
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['4190:9000', '4191:9001']
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']

  setup:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment:
      <<: *app-env
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    command: >
      sh -c "node dist/db/migrate-cli.js && node dist/storage-setup.js &&
             node /infra/rabbitmq/apply.mjs cip && node /infra/clickhouse/migrate.mjs cip && node dist/seed.js"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      clickhouse: { condition: service_started }
      minio: { condition: service_started }
    restart: 'no'

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *app-env
    ports: ['4100:4100']
    depends_on: { setup: { condition: service_completed_successfully } }
  embeddings-server:
    build: { context: ., dockerfile: infra/docker/embeddings-server.Dockerfile }
    ports: ['4189:4189']
  collector:
    build: { context: ., dockerfile: infra/docker/collector.Dockerfile }
    environment: *app-env
    ports: ['4110:4110']
    depends_on: { setup: { condition: service_completed_successfully } }
  stream-worker:
    build: { context: ., dockerfile: infra/docker/stream-worker.Dockerfile }
    environment: { <<: *app-env, STREAM_WORKER_PORT: '4150' }
    depends_on: { setup: { condition: service_completed_successfully } }
  domain-worker:
    build: { context: ., dockerfile: infra/docker/domain-worker.Dockerfile }
    environment: { <<: *app-env, DOMAIN_WORKER_PORT: '4151' }
    depends_on: { setup: { condition: service_completed_successfully } }
  realtime-gateway:
    build: { context: ., dockerfile: infra/docker/realtime-gateway.Dockerfile }
    environment: *app-env
    ports: ['4120:4120']
    depends_on: { setup: { condition: service_completed_successfully } }
  simulator:
    build: { context: ., dockerfile: infra/docker/simulator.Dockerfile }
    environment: *app-env
    depends_on: [api, collector]
  storefront:
    build: { context: ., dockerfile: infra/docker/storefront.Dockerfile }
    environment: *app-env
    ports: ['4130:4130']
    depends_on: [api]
  admin:
    build: { context: ., dockerfile: infra/docker/admin.Dockerfile }
    environment: *app-env
    ports: ['4140:4140']
    depends_on: [api]

  prometheus:
    image: prom/prometheus
    profiles: [observability]
    volumes:
      - ./infra/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
    ports: ['9090:9090']
  datastore-exporter:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    profiles: [observability]
    command: ['node', '/infra/prometheus/datastore-exporter.mjs']
    environment:
      DATASTORE_EXPORTER_HOST: 0.0.0.0
      DATASTORE_PG_URL: postgres://postgres@postgres:5432/postgres
      DATASTORE_REDIS_HOST: redis
      DATASTORE_CLICKHOUSE_URL: http://clickhouse:8123
    depends_on: [postgres, redis, clickhouse]
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: [observability]
    command: ['--config', '/etc/jaeger/jaeger.yml']
    environment: { JAEGER_BIND: 0.0.0.0 }
    volumes: ['./infra/jaeger/jaeger.yml:/etc/jaeger/jaeger.yml:ro']
    ports: ['4193:4193', '4194:4194', '4195:4195']
  loki:
    image: grafana/loki
    profiles: [observability]
    ports: ['3100:3100']
  grafana:
    image: grafana/grafana
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PLUGINS_PREINSTALL_SYNC: prometheus,jaeger
      CIP_PROMETHEUS_URL: http://prometheus:9090
      CIP_JAEGER_URL: http://jaeger:4193
      CIP_GRAFANA_DASHBOARDS: /var/lib/grafana/dashboards
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
