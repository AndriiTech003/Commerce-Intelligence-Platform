[server]
protocol = http
http_addr = 127.0.0.1
http_port = 4192
root_url = http://127.0.0.1:4192/

[security]
admin_user = admin
admin_password = admin
disable_initial_admin_creation = false
cookie_samesite = lax

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true
preinstall_sync = prometheus,jaeger
preinstall_auto_update = false

[unified_alerting]
enabled = true
min_interval = 10s

[smtp]
enabled = true
host = 127.0.0.1:1025
skip_verify = true
from_address = grafana@cip.dev
from_name = CIP Grafana

[log]
mode = file
level = warn

[dashboards]
min_refresh_interval = 5s
